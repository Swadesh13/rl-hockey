train_env:
  n_envs: 16
  seed: 42
  render_mode: None
  mode: "all"
  env_name: "Hockey-v0"
  weak_opponent: false
  additional_rewards: []
  reward_multiplier: 1.0

environment:
  n_envs: 16
  seed: 42
  render_mode: None
  env_name: "Hockey-v0"
  weak_opponent: false
  additional_rewards: []
  reward_multiplier: 1.0

eval_env:
  seed: 42
  env_name: "Hockey-v0"
  weak_opponent: false
  additional_rewards: []


agent:
  save_dir: "models/"
  save: false

model:
  name: "td7"
  models_dir: "models/"
  load: true 
  model_load_name: td7_all
  hyperparameters:
    exploration_noise: 
      type : "normal"
      magnitude : 0.1
    alpha: 0.6
    buffer_size: 2_000_000  
    learning_starts: 7500 
    batch_size: 4096  
    discount: 0.99
    target_update_rate: 125
    target_policy_noise: 0.2
    policy_freq: 2
    noise_clip: 0.2
    learning_rate: 0.0004
    zs_dim: 256
    h_dim: 256
    device: "cuda"
    seed: 42
    use_checkpoint: false
    steps_before_checkpointing: 10_000
    max_eps_when_checkpointing: 20
    reset_weight:  0.9
    min_priority: 1

training:
  total_timesteps: 125_000
  save_model_every: 10_000
  eval_starts: 10_000
  eval_every: 10_000
  model_path: "dummy not used for compatablity"
  eval_episode_num: 20
  log_interval: 1000

evaluation:
  mode: "team"
  weak: false
  algo: "sac"
  type: "sac_reward"
  ep_num: 10
  render_mode: "human"

rnd:
  enabled: false