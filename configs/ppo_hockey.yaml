# ppo_config.yaml

environment:
  env_name: Hockey-v0
  n_envs: 4
  seed: 42
  reward_multiplier: 10
  additional_rewards: []

model:
  name: ppo
  models_dir: ppo/models/
  hyperparameters:
    learning_rate: 0.0001
    n_steps: 1024
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    clip_range_vf: null  # Default is no clipping
    normalize_advantage: true  # Default normalization
    use_sde: false  # Default to no SDE
    target_kl: null  # Default is no KL constraint
    vf_coef: 0.5
    ent_coef: 0.01
    max_grad_norm: 0.5
    # policy_kwargs:
    #   net_arch:  # Policy architecture
    #     pi: [64, 64]
    #     vf: [64, 64]
    #   activation_fn: relu  # Default activation function

training:
  total_timesteps: 7_000_000
  log_interval: 1
  model_path: ppo/models/ppo_test
  save_model_every: 50_000

logging:
  log_dir: ./logs/
  verbose: 1
  tensorboard: ./ppo/logs/
