# sac_config.yaml

environment:
  env_name: "Hockey-v0"
  n_envs: 1
  seed: 42
  reward_multiplier: 10
  additional_rewards: False

model:
  name: "sac"  # Could be "td3", "sac", etc.
  models_dir: "sac/models/"
  hyperparameters:
    learning_rate: 0.001  # learning rate for adam optimizer
    buffer_size: 1000000  # size of the replay buffer
    learning_starts: 1000  # how many steps of the model to collect transitions for before learning starts
    batch_size: 1024  # Minibatch size for each gradient update
    tau: 0.005  # the soft update coefficient ("Polyak update", between 0 and 1)
    gamma: 0.99  # the discount factor
    train_freq: 1  # Update the model every `train_freq` steps
    gradient_steps: 1  # How many gradient steps to do after each rollout (see `train_freq`)
  noise: "pink" # None, pink, brown
  prioritized_memory: False

training:
  total_timesteps: 100000
  log_interval: 1
  # save_model_every: 10000
  model_path: "sac/models/sac_hockey"

logging:
  log_dir: "./logs/"
  verbose: 0
  tensorboard: "./logs/tensorboard/"
