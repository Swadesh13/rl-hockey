# ppo_config.yaml

environment:
  env_name: Hockey-v0
  n_envs: 4
  seed: 42
  reward_multiplier: 10
  additional_rewards: []

model:
  name: ppo
  models_dir: ppo/models/
  hyperparameters:
    learning_rate: 0.0001
    n_steps: 1024
    batch_size: 64
    n_epochs: 10
    gamma: 0.98
    gae_lambda: 0.9
    clip_range: 0.1
    clip_range_vf: 0.2  # Default is no clipping
    normalize_advantage: false  # Default normalization
    use_sde: true  # Default to no SDE
    sde_sample_freq: 4
    target_kl: 0.01  # Default is no KL constraint
    vf_coef: 0.75
    ent_coef: 0.01
    max_grad_norm: 2.0
    policy_kwargs:
      net_arch: [256, 256] # 256,256
      ortho_init: true # true
      activation_fn: relu  # Default activation function relu

training:
  total_timesteps: 40_000_000
  log_interval: 1
  model_path: ppo/models/ppo_test
  save_model_every: 50_000

logging:
  log_dir: ./logs/
  verbose: 1
  tensorboard: ./ppo/logs/

